version: "3.9"
services:
  qdrant-master:
    image: qdrant/qdrant:v1.9.0
    ports: ["6333:6333"]
    volumes:
      - qdrant_master_data:/qdrant/storage
  qdrant-replica:
    image: qdrant/qdrant:v1.9.0
    ports: ["6334:6333"]
    volumes:
      - qdrant_replica_data:/qdrant/storage
    depends_on: [qdrant-master]
  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]

volumes:
  qdrant_master_data:
  qdrant_replica_data: