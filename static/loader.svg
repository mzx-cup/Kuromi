<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Earth gradient -->
    <radialGradient id="earth-grad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <!-- Earth glow -->
    <radialGradient id="earth-glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="rgba(59,130,246,0.3)"/>
      <stop offset="100%" stop-color="rgba(59,130,246,0)"/>
    </radialGradient>
    <!-- Star glow -->
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="rgba(251,191,36,0.6)"/>
      <stop offset="100%" stop-color="rgba(251,191,36,0)"/>
    </radialGradient>
    <!-- Trail gradient -->
    <linearGradient id="trail-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Orbit ring - 45 degree tilted ellipse -->
  <g transform="translate(100,100) rotate(-15) scale(1,0.45)">
    <ellipse cx="0" cy="0" rx="75" ry="75" fill="none" stroke="rgba(59,130,246,0.2)" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="75" ry="75" fill="none" stroke="rgba(59,130,246,0.08)" stroke-width="4" stroke-dasharray="8 20"/>
  </g>

  <!-- Earth -->
  <circle cx="100" cy="100" r="28" fill="url(#earth-glow)"/>
  <circle cx="100" cy="100" r="22" fill="url(#earth-grad)"/>
  <!-- Latitude lines -->
  <ellipse cx="100" cy="100" rx="22" ry="6" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
  <ellipse cx="100" cy="95" rx="22" ry="3" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <ellipse cx="100" cy="105" rx="22" ry="4" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <!-- Longitude lines -->
  <ellipse cx="100" cy="100" rx="6" ry="22" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <ellipse cx="100" cy="100" rx="3" ry="22" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <!-- Horizontal equator -->
  <line x1="78" y1="100" x2="122" y2="100" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>

  <!-- Yellow 4-pointed star -->
  <g transform="translate(100,25)">
    <!-- Star glow -->
    <circle cx="0" cy="0" r="14" fill="url(#star-glow)"/>
    <!-- 4-pointed star shape -->
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#fbbf24"/>
    <polygon points="0,-6 2,-2 6,0 2,2 0,6 -2,2 -6,0 -2,-2" fill="#fef3c7"/>
    <!-- Star core -->
    <circle cx="0" cy="0" r="2" fill="#fff"/>
  </g>

  <!-- Trail particles behind the star -->
  <g transform="translate(100,25)">
    <circle cx="-16" cy="-4" r="2.5" fill="#fbbf24" opacity="0.7"/>
    <circle cx="-24" cy="-8" r="2" fill="#fbbf24" opacity="0.45"/>
    <circle cx="-30" cy="-12" r="1.5" fill="#fbbf24" opacity="0.25"/>
    <circle cx="-35" cy="-15" r="1" fill="#fbbf24" opacity="0.12"/>
    <circle cx="-12" cy="-7" r="1.8" fill="#fcd34d" opacity="0.55"/>
  </g>
</svg>
