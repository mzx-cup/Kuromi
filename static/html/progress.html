<!DOCTYPE html>
<html data-bg-unified="true" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习进度 · 星识 Star-Learn</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app-base.css">
    <link rel="stylesheet" href="/css/theme-bg.css">
    <link rel="stylesheet" href="/css/theme-modal.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/loading.css">
    <link rel="stylesheet" href="/css/hub.css">
    <link rel="stylesheet" href="/css/mascot.css">
    <link rel="stylesheet" href="/css/search-command.css">
    <link rel="stylesheet" href="/css/onboarding.css">
    <link rel="stylesheet" href="/css/progress.css">
    <script src="/js/auth.js"></script>
    <script src="/js/http-intercept.js"></script>
    <script src="/js/loading.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/toast.js"></script>
</head>
<body data-bg-unified="true" class="app-body hub-body progress-body">
    <!-- 统一背景层 -->
    

    <!-- 顶部导航 — 使用统一 .app-nav 组件 -->
    <nav class="app-nav">
        <div class="app-nav-inner">
            <div class="app-nav-left">
                <a href="/hub.html" class="app-nav-back" title="返回中枢" aria-label="返回中枢">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <div>
                    <h1 class="app-nav-title">学习进度</h1>
                    <p class="app-nav-subtitle">可视化呈现你的成长轨迹</p>
                </div>
            </div>
            <div class="app-nav-right">
                <div class="time-range" role="tablist" aria-label="时间范围">
                    <button class="time-range-btn" data-range="week" role="tab" aria-selected="false">本周</button>
                    <button class="time-range-btn active" data-range="month" role="tab" aria-selected="true">本月</button>
                    <button class="time-range-btn" data-range="year" role="tab" aria-selected="false">本年</button>
                    <button class="time-range-btn" data-range="all" role="tab" aria-selected="false">全部</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="progress-page fade-in">
        <!-- 顶部统计卡 -->
        <section class="stat-grid" id="stat-grid" aria-label="学习数据概览">
            <div class="stat-card" data-stat="total-hours">
                <div class="stat-card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <polyline points="12 7 12 12 15 14"/>
                    </svg>
                </div>
                <div class="stat-card-body">
                    <div class="stat-card-value">
                        <span data-field="value">0</span>
                        <span class="unit">小时</span>
                    </div>
                    <div class="stat-card-label">
                        <span>总学习时长</span>
                        <span class="stat-card-delta neutral" data-field="delta">—</span>
                    </div>
                </div>
            </div>

            <div class="stat-card" data-stat="completed-courses">
                <div class="stat-card-icon success">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 12l2 2 4-4"/>
                        <circle cx="12" cy="12" r="9"/>
                    </svg>
                </div>
                <div class="stat-card-body">
                    <div class="stat-card-value">
                        <span data-field="value">0</span>
                        <span class="unit">门</span>
                    </div>
                    <div class="stat-card-label">
                        <span>已完成课程</span>
                        <span class="stat-card-delta neutral" data-field="delta">—</span>
                    </div>
                </div>
            </div>

            <div class="stat-card" data-stat="current-streak">
                <div class="stat-card-icon warning">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2c1 3 4 5.5 4 9a4 4 0 11-8 0c0-1.5.5-2.5 1-3.5C8 9 8 11 9 12c0-3 2-5 2-7 1 1 2 2 2 4 0-2-1-4-1-7z"/>
                    </svg>
                </div>
                <div class="stat-card-body">
                    <div class="stat-card-value">
                        <span data-field="value">0</span>
                        <span class="unit">天</span>
                    </div>
                    <div class="stat-card-label">
                        <span>连续学习</span>
                        <span class="stat-card-delta neutral" data-field="delta">—</span>
                    </div>
                </div>
            </div>

            <div class="stat-card" data-stat="avg-daily">
                <div class="stat-card-icon info">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3v18h18"/>
                        <path d="M7 14l3-3 4 4 5-7"/>
                    </svg>
                </div>
                <div class="stat-card-body">
                    <div class="stat-card-value">
                        <span data-field="value">0.0</span>
                        <span class="unit">小时</span>
                    </div>
                    <div class="stat-card-label">
                        <span>日均学习</span>
                        <span class="stat-card-delta neutral" data-field="delta">—</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 图表区 -->
        <section class="charts-row" aria-label="学习活动与课程进度">
            <div class="chart-card">
                <div class="chart-card-header">
                    <div>
                        <h2 class="chart-card-title">本周学习活动</h2>
                        <p class="chart-card-subtitle">每日学习时长分布</p>
                    </div>
                </div>
                <div class="chart-card-body">
                    <div class="bar-chart" id="weekly-chart" role="img" aria-label="本周学习时长柱状图">
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="20" x2="12" y2="10"/>
                                    <line x1="18" y1="20" x2="18" y2="4"/>
                                    <line x1="6" y1="20" x2="6" y2="16"/>
                                </svg>
                            </div>
                            <p class="empty-state-title">正在加载学习活动...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-card-header">
                    <div>
                        <h2 class="chart-card-title">课程进度概览</h2>
                        <p class="chart-card-subtitle">各分类学习完成率</p>
                    </div>
                </div>
                <div class="chart-card-body">
                    <div class="course-progress-list" id="course-progress-list">
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                                </svg>
                            </div>
                            <p class="empty-state-title">正在加载课程进度...</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 能力雷达 + 学习记录 -->
        <section class="charts-row" aria-label="能力雷达与学习记录">
            <div class="chart-card">
                <div class="chart-card-header">
                    <div>
                        <h2 class="chart-card-title">能力雷达图</h2>
                        <p class="chart-card-subtitle">综合能力评估</p>
                    </div>
                </div>
                <div class="chart-card-body">
                    <div class="radar-container">
                        <svg class="radar-svg" viewBox="0 0 320 280" role="img" aria-label="能力雷达图">
                            <defs>
                                <linearGradient id="radarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="var(--brand-400)" stop-opacity="0.55"/>
                                    <stop offset="100%" stop-color="var(--info)" stop-opacity="0.25"/>
                                </linearGradient>
                            </defs>
                            <g class="radar-grid" id="radar-grid">
                                <!-- 由 JS 渲染 -->
                            </g>
                            <g class="radar-axis" id="radar-axis">
                                <!-- 由 JS 渲染 -->
                            </g>
                            <g class="radar-labels" id="radar-labels">
                                <!-- 由 JS 渲染 -->
                            </g>
                            <polygon class="radar-shape" id="radar-shape" points="" fill="url(#radarGradient)"/>
                            <g class="radar-points" id="radar-points">
                                <!-- 由 JS 渲染 -->
                            </g>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="chart-card">
                <div class="chart-card-header">
                    <div>
                        <h2 class="chart-card-title">最近学习记录</h2>
                        <p class="chart-card-subtitle">近期学习动态</p>
                    </div>
                </div>
                <div class="chart-card-body">
                    <div class="timeline-list" id="learning-timeline">
                        <div class="empty-state">
                            <div class="empty-state-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="9"/>
                                    <polyline points="12 7 12 12 15 14"/>
                                </svg>
                            </div>
                            <p class="empty-state-title">正在加载学习记录...</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 学习成就 -->
        <section class="achievements" aria-label="学习成就">
            <div class="section-header">
                <div>
                    <h2 class="section-title">学习成就</h2>
                    <p class="section-subtitle">已解锁的里程碑</p>
                </div>
                <div class="section-meta">
                    已解锁 <strong id="unlocked-count">0</strong> / <span id="total-count">0</span>
                </div>
            </div>
            <div class="achievements-grid" id="achievements-grid">
                <!-- 由 JS 渲染 -->
            </div>
        </section>
    </main>

    <script src="/js/kanban.js"></script>
    <script src="/js/mascot-services.js"></script>
    <script src="/js/mascot-core.js"></script>
    <script src="/js/mascot-panel.js"></script>
    <script src="/js/data-layer.js"></script>
    <script src="/js/demo-data.js"></script>
    <script src="/js/progress.js"></script>
    <script src="/js/search-command.js"></script>
    <script src="/js/onboarding.js"></script>
</body>
</html>
