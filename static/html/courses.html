<!DOCTYPE html>
<html data-bg-unified="true" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星识 - 课程中心</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app-base.css">
    <link rel="stylesheet" href="/css/theme-bg.css">
    <link rel="stylesheet" href="/css/theme-modal.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/courses.css">
    <link rel="stylesheet" href="/css/mascot.css">
    <link rel="stylesheet" href="/css/loading.css">
    <script src="/js/loading.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/http-intercept.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/toast.js"></script>
</head>
<body data-bg-unified="true" class="app-body courses-body" data-page="courses">
    <!-- 背景层 -->
    
<!-- 顶部导航 -->
    <nav class="cc-nav">
        <div class="cc-nav-inner">
            <div class="cc-nav-left">
                <a href="/hub.html" class="cc-back-link" aria-label="返回中枢">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                    <span>中枢</span>
                </a>
                <div class="cc-nav-divider"></div>
                <h1 class="cc-nav-title">课程中心</h1>
            </div>
            <div class="cc-nav-right">
                <button class="cc-icon-btn" id="cc-edit-btn" type="button" title="编辑课程" aria-label="编辑课程">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path d="M12 20h9M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>编辑课程</span>
                </button>
                <button class="cc-icon-btn" id="theme-settings-btn" type="button" title="主题设置" aria-label="主题设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="cc-icon-btn" onclick="Auth.logout()" type="button" title="退出登录" aria-label="退出登录">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主体 -->
    <main class="cc-main">
        <div class="cc-container">

            <!-- 学习概览 -->
            <section class="cc-overview" aria-label="学习总览">
                <div class="cc-overview-head">
                    <div>
                        <h2 class="cc-overview-title">我的学习</h2>
                        <p class="cc-overview-sub">所有已添加的课程,按学科归类整理</p>
                    </div>
                    <div class="cc-overview-actions">
                        <button class="cc-quick-import" id="cc-quick-import" type="button">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                            <span>快速导入</span>
                        </button>
                    </div>
                </div>
                <div class="cc-stats" id="cc-stats">
                    <div class="cc-stat-card" data-key="subjects">
                        <div class="cc-stat-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M4 6h16M4 12h16M4 18h16"/>
                            </svg>
                        </div>
                        <div class="cc-stat-body">
                            <div class="cc-stat-value" id="cc-stat-subjects">0</div>
                            <div class="cc-stat-label">学科</div>
                        </div>
                    </div>
                    <div class="cc-stat-card" data-key="courses">
                        <div class="cc-stat-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/>
                            </svg>
                        </div>
                        <div class="cc-stat-body">
                            <div class="cc-stat-value" id="cc-stat-courses">0</div>
                            <div class="cc-stat-label">课程</div>
                        </div>
                    </div>
                    <div class="cc-stat-card" data-key="lessons">
                        <div class="cc-stat-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div class="cc-stat-body">
                            <div class="cc-stat-value" id="cc-stat-lessons">0</div>
                            <div class="cc-stat-label">课时</div>
                        </div>
                    </div>
                    <div class="cc-stat-card" data-key="progress">
                        <div class="cc-stat-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M22 12A10 10 0 1 1 12 2" stroke-linecap="round"/>
                                <polyline points="22 4 12 14.01 9 11.01" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <div class="cc-stat-body">
                            <div class="cc-stat-value" id="cc-stat-progress">0%</div>
                            <div class="cc-stat-label">平均进度</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 学科 + 课程 主体 -->
            <section class="cc-body" id="cc-body" aria-live="polite">
                <div class="cc-loading">
                    <div class="cc-spinner"></div>
                    <span>正在加载课程...</span>
                </div>
            </section>

        </div>
    </main>

    <!-- 编辑课程弹窗 -->
    <div class="cc-modal" id="cc-edit-modal" hidden>
        <div class="cc-modal-backdrop" data-close></div>
        <div class="cc-modal-panel" role="dialog" aria-modal="true" aria-labelledby="cc-edit-title">
            <header class="cc-modal-head">
                <h3 id="cc-edit-title">编辑课程</h3>
                <button class="cc-modal-close" data-close type="button" aria-label="关闭">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </header>
            <div class="cc-modal-body" id="cc-edit-body">
                <div class="cc-loading">
                    <div class="cc-spinner"></div>
                </div>
            </div>
            <footer class="cc-modal-foot">
                <button class="cc-btn ghost" id="cc-add-subject" type="button">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    添加科目
                </button>
                <button class="cc-btn primary" id="cc-edit-done" type="button">完成</button>
            </footer>
        </div>
    </div>

    <!-- B 站导入弹窗 -->
    <div class="cc-modal" id="cc-import-modal" hidden>
        <div class="cc-modal-backdrop" data-close></div>
        <div class="cc-modal-panel cc-import-panel" role="dialog" aria-modal="true" aria-labelledby="cc-import-title">
            <header class="cc-modal-head">
                <h3 id="cc-import-title">B 站视频导入</h3>
                <button class="cc-modal-close" data-close type="button" aria-label="关闭">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </header>
            <nav class="cc-tabs" role="tablist">
                <button class="cc-tab active" data-tab="link" type="button" role="tab">粘贴链接</button>
                <button class="cc-tab" data-tab="search" type="button" role="tab">搜索视频</button>
                <button class="cc-tab" data-tab="playlist" type="button" role="tab">合集导入</button>
            </nav>
            <div class="cc-tab-panels">
                <div class="cc-tab-panel active" data-tab-panel="link" role="tabpanel">
                    <p class="cc-tab-hint">粘贴一个或多个 B 站视频链接,每行一个</p>
                    <textarea class="cc-textarea" id="cc-link-text" rows="4" placeholder="https://www.bilibili.com/video/BV..."></textarea>
                    <button class="cc-btn primary" id="cc-link-parse" type="button">解析</button>
                    <div class="cc-results" id="cc-link-results" hidden></div>
                </div>
                <div class="cc-tab-panel" data-tab-panel="search" role="tabpanel" hidden>
                    <div class="cc-search-row">
                        <input type="text" class="cc-input" id="cc-search-input" placeholder="输入关键词搜索 B 站视频...">
                        <button class="cc-btn primary" id="cc-search-btn" type="button">搜索</button>
                    </div>
                    <div class="cc-results" id="cc-search-results" hidden></div>
                </div>
                <div class="cc-tab-panel" data-tab-panel="playlist" role="tabpanel" hidden>
                    <p class="cc-tab-hint">粘贴 B 站合集/播放列表链接,视频将作为一门课程导入</p>
                    <div class="cc-search-row">
                        <input type="text" class="cc-input" id="cc-playlist-url" placeholder="https://space.bilibili.com/xxx/channel/seriesdetail?sid=xxx">
                        <button class="cc-btn primary" id="cc-playlist-parse" type="button">解析</button>
                    </div>
                    <div class="cc-results" id="cc-playlist-results" hidden></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <script src="/js/bilibili-import.js"></script>
    <script src="/js/courses.js"></script>

    <!-- 小星 AI 助手 -->
    <div class="app-kanban" id="app-kanban"></div>
    <script src="/js/kanban.js"></script>
    <script src="/js/mascot-services.js"></script>
    <script src="/js/mascot-core.js"></script>
    <script src="/js/mascot-panel.js"></script>
</body>
</html>
