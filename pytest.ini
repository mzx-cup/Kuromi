[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: slow tests (LLM/network)
    ai: AI/LLM tests (consume API quota)
    cv: CV image/video tests
    e2e: end-to-end tests (require running service)
    unit: unit tests (no external deps)
    contract: contract tests (dual-backend comparison)
    dual_write: dual-write consistency tests
    perf: performance tests
    smoke: smoke tests (M1-M5 baseline API health checks)
filterwarnings =
    ignore::DeprecationWarning
addopts = -ra --strict-markers