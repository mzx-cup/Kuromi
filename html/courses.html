<!DOCTYPE html>
<html data-bg-unified="true" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星识 - 课程中心</title>
    <script defer src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app-base.css">
    <link rel="stylesheet" href="/css/app-bg.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/courses.css">
    <link rel="stylesheet" href="/css/mascot.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <script src="/js/loading.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/http-intercept.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/toast.js"></script>
</head>
<body data-bg-unified="true" class="app-body courses-body" data-page="courses">
    <!-- Global Wallpaper Background -->
    <div id="app-bg" class="app-bg-layer">
        <div class="app-bg-stars"></div>
        <div class="app-bg-nebula"></div>
        <div class="app-bg-orb app-bg-orb-1"></div>
        <div class="app-bg-orb app-bg-orb-2"></div>
        <div class="app-bg-orb app-bg-orb-3"></div>
    </div>

    <div class="global-bg-layer" id="global-bg-layer"></div>
    <video class="global-bg-video" id="global-bg-video" style="display:none;" autoplay loop muted playsinline></video>

    <!-- Top Navigation -->
    <nav class="courses-nav">
        <div class="courses-nav-inner max-w-[1400px] mx-auto px-6 h-full flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/hub.html" class="courses-back-link">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                    <span>返回中枢</span>
                </a>
                <h1 class="courses-nav-title">课程中心</h1>
            </div>
            <div class="flex items-center gap-3">
                <button class="courses-edit-btn" id="courses-edit-btn" aria-label="编辑课程">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>编辑课程</span>
                </button>
                <button class="theme-settings-btn" id="theme-settings-btn" aria-label="主题设置" title="主题设置">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="3" stroke-width="2"/>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content - Khan Academy Style -->
    <main class="courses-main fade-in">
        <div class="courses-container max-w-[1400px] mx-auto px-6 py-8" id="subjects-container">
            <!-- Dynamically populated by courses.js -->
        </div>
    </main>

    <!-- Edit Courses Modal (Liquid Glass) -->
    <div class="modal-overlay hidden" id="edit-courses-modal">
        <div class="edit-courses-panel glass-card">
            <div class="edit-header">
                <h3>编辑课程</h3>
                <button class="edit-close" id="edit-close">&times;</button>
            </div>
            <div class="edit-body" id="edit-body">
                <!-- Dynamically populated -->
            </div>
            <div class="edit-footer">
                <button class="edit-action-btn ghost" id="edit-add-subject">+ 添加科目</button>
                <button class="edit-action-btn primary" id="edit-done">完成</button>
            </div>
        </div>
    </div>

    <!-- B站 Import Modal (Liquid Glass) -->
    <div class="modal-overlay hidden" id="bilibili-import-modal">
        <div class="bilibili-import-panel glass-card">
            <div class="im-header">
                <h3>B站视频导入</h3>
                <button class="im-close" id="im-close">&times;</button>
            </div>
            <div class="im-tabs">
                <button class="im-tab active" data-tab="link">粘贴链接</button>
                <button class="im-tab" data-tab="search">搜索视频</button>
                <button class="im-tab" data-tab="playlist">合集导入</button>
            </div>
            <!-- Tab: Paste Links -->
            <div class="im-body" id="im-tab-link">
                <p class="im-hint">粘贴一个或多个B站视频链接，每行一个</p>
                <textarea class="im-textarea" id="im-link-text" rows="4" placeholder="https://www.bilibili.com/video/BV..."></textarea>
                <button class="im-btn primary" id="im-link-parse">解析</button>
                <div class="im-results hidden" id="im-link-results"></div>
            </div>
            <!-- Tab: Search -->
            <div class="im-body hidden" id="im-tab-search">
                <div class="im-search-row">
                    <input type="text" class="im-search-input" id="im-search-input" placeholder="输入关键词搜索B站视频...">
                    <button class="im-btn primary" id="im-search-btn">搜索</button>
                </div>
                <div class="im-results hidden" id="im-search-results"></div>
            </div>
            <!-- Tab: Playlist -->
            <div class="im-body hidden" id="im-tab-playlist">
                <p class="im-hint">粘贴B站合集/播放列表链接，视频将作为一门课程导入</p>
                <div class="im-search-row">
                    <input type="text" class="im-search-input" id="im-playlist-url" placeholder="https://space.bilibili.com/xxx/channel/seriesdetail?sid=xxx">
                    <button class="im-btn primary" id="im-playlist-parse">解析</button>
                </div>
                <div class="im-results hidden" id="im-playlist-results"></div>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/js/bilibili-import.js"></script>
    <script src="/js/courses.js"></script>

    <!-- 小星 AI 助手 -->
    <div class="app-kanban" id="app-kanban"></div>
    <script src="/js/kanban.js"></script>
    <script src="/js/mascot-services.js"></script>
    <script src="/js/mascot-core.js"></script>
    <script src="/js/mascot-panel.js"></script>
</body>
</html>
