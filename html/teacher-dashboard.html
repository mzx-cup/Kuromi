<!DOCTYPE html>
<html lang="zh-CN" data-theme="starry-night">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师工作台 · 星识 Star-Learn</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/teacher.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script defer src="/js/alpinejs.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/http-intercept.js"></script>
  <script src="/js/pages/teacher-dashboard.js"></script>
</head>
<body class="teacher-page">

  <!-- ════════════════════════════════════════════
       SVG 全局定义 — 渐变 & 滤镜
       ════════════════════════════════════════════ -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="var(--info)"/>
        <stop offset="50%" stop-color="var(--brand-300)"/>
        <stop offset="100%" stop-color="var(--warning)"/>
      </linearGradient>
      <linearGradient id="constLineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#7098d0" stop-opacity="0"/>
        <stop offset="50%" stop-color="#7098d0" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="#7098d0" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="constLineGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#b898d8" stop-opacity="0"/>
        <stop offset="50%" stop-color="#b898d8" stop-opacity="0.50"/>
        <stop offset="100%" stop-color="#b898d8" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="constLineGrad3" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#c8a868" stop-opacity="0"/>
        <stop offset="50%" stop-color="#c8a868" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#c8a868" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="constLineGrad4" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#80a0d8" stop-opacity="0"/>
        <stop offset="50%" stop-color="#80a0d8" stop-opacity="0.48"/>
        <stop offset="100%" stop-color="#80a0d8" stop-opacity="0"/>
      </linearGradient>
      <filter id="starGlowFilter" x="-200%" y="-200%" width="500%" height="500%">
        <feGaussianBlur stdDeviation="0.6" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="starGlowBright" x="-300%" y="-300%" width="700%" height="700%">
        <feGaussianBlur stdDeviation="1.2" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
  </svg>

  <!-- ════════════════════════════════════════════
       深空背景系统 · Constellation Prism (4 层叠加)
       ════════════════════════════════════════════ -->
  <div class="teacher-bg">
    <div class="teacher-bg-nebula"></div>
    <div class="teacher-bg-orb-1"></div>
    <div class="teacher-bg-orb-2"></div>
    <svg class="teacher-bg-stars" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

        <circle cx="45"  cy="72"  r="0.6" fill="#8098c8"/><circle cx="120" cy="38"  r="0.4" fill="#8898c0"/>
        <circle cx="210" cy="95"  r="0.8" fill="#90a0d0"/><circle cx="280" cy="25"  r="0.5" fill="#7888b8"/>

        <circle cx="660" cy="200" r="0.6" fill="#90a0c8"/><circle cx="730" cy="88"  r="1.0" fill="#b0c0e0"/>
        <circle cx="810" cy="45"  r="0.5" fill="#8090b8"/><circle cx="890" cy="160" r="0.7" fill="#8898c0"/>
        <circle cx="960" cy="30"  r="0.4" fill="#7888b0"/><circle cx="1050" cy="210" r="0.8" fill="#90a0d0"/>

        <circle cx="380" cy="380" r="0.6" fill="#8898c0"/><circle cx="550" cy="450" r="0.7" fill="#90a0c8"/>
        <circle cx="720" cy="350" r="0.5" fill="#8098c0"/><circle cx="880" cy="420" r="0.8" fill="#8898c8"/>

      </g>
      <g transform="translate(180, 100)" filter="url(#starGlowBright)" opacity="0.7">
        <line x1="-5" y1="0" x2="5" y2="0" stroke="#d0d8f0" stroke-width="0.3"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="#d0d8f0" stroke-width="0.3"/>
        <line x1="-3" y1="-3" x2="3" y2="3" stroke="#c0c8e8" stroke-width="0.15"/>
        <line x1="3" y1="-3" x2="-3" y2="3" stroke="#c0c8e8" stroke-width="0.15"/>
        <circle cx="0" cy="0" r="1.2" fill="#e0e8f8"/>
      </g>
      <g transform="translate(920, 280)" filter="url(#starGlowBright)" opacity="0.8">
        <line x1="-6" y1="0" x2="6" y2="0" stroke="#c8e8f0" stroke-width="0.35"/>

        <line x1="-4" y1="-4" x2="4" y2="4" stroke="#b8d8e8" stroke-width="0.18"/>
        <line x1="4" y1="-4" x2="-4" y2="4" stroke="#b8d8e8" stroke-width="0.18"/>
        <circle cx="0" cy="0" r="1.4" fill="#e8f4f8"/>
      </g>
      <g transform="translate(1100, 560)" filter="url(#starGlowFilter)" opacity="0.55">

        <line x1="0" y1="-4" x2="0" y2="4" stroke="#e8d8b0" stroke-width="0.25"/>

        <line x1="180" y1="100" x2="250" y2="120" stroke="url(#constLineGrad2)" stroke-width="0.55"/>
        <line x1="250" y1="120" x2="200" y2="180" stroke="url(#constLineGrad1)" stroke-width="0.6"/>
        <line x1="200" y1="180" x2="120" y2="150" stroke="url(#constLineGrad2)" stroke-width="0.55"/>
        <line x1="180" y1="100" x2="140" y2="220" stroke="url(#constLineGrad4)" stroke-width="0.4" stroke-dasharray="3 6"/>
        <circle cx="120" cy="150" r="3.0" fill="#7098d0" filter="url(#starGlowFilter)"/>
        <circle cx="180" cy="100" r="3.5" fill="#80a8e0" filter="url(#starGlowBright)"/>
        <circle cx="250" cy="120" r="2.5" fill="#6888c0" filter="url(#starGlowFilter)"/>
        <circle cx="200" cy="180" r="2.0" fill="#7098c8" filter="url(#starGlowFilter)"/>
        <circle cx="140" cy="220" r="1.8" fill="#6080b8" filter="url(#starGlowFilter)"/>
      </g>
      <!-- 猎户座 -->
      <g opacity="0.58">
        <line x1="900" y1="200" x2="920" y2="280" stroke="url(#constLineGrad2)" stroke-width="0.6"/>
        <line x1="920" y1="280" x2="880" y2="300" stroke="url(#constLineGrad3)" stroke-width="0.7"/>
        <line x1="880" y1="300" x2="960" y2="320" stroke="url(#constLineGrad3)" stroke-width="0.7"/>
        <line x1="960" y1="320" x2="920" y2="280" stroke="url(#constLineGrad3)" stroke-width="0.7"/>
        <line x1="920" y1="280" x2="940" y2="400" stroke="url(#constLineGrad1)" stroke-width="0.55"/>
        <line x1="940" y1="400" x2="910" y2="480" stroke="url(#constLineGrad4)" stroke-width="0.4" stroke-dasharray="3 6"/>
        <line x1="940" y1="400" x2="970" y2="470" stroke="url(#constLineGrad4)" stroke-width="0.4" stroke-dasharray="3 6"/>
        <circle cx="900" cy="200" r="2.5" fill="#80a0d8" filter="url(#starGlowFilter)"/>
        <circle cx="920" cy="280" r="3.5" fill="#68c0c8" filter="url(#starGlowBright)"/>
        <circle cx="880" cy="300" r="2.8" fill="#d8b070" filter="url(#starGlowFilter)"/>
        <circle cx="960" cy="320" r="2.8" fill="#d8b070" filter="url(#starGlowFilter)"/>
        <circle cx="940" cy="400" r="2.2" fill="#7098c8" filter="url(#starGlowFilter)"/>
        <circle cx="910" cy="480" r="1.8" fill="#6088b8" filter="url(#starGlowFilter)"/>
        <circle cx="970" cy="470" r="1.8" fill="#6088b8" filter="url(#starGlowFilter)"/>
      </g>
      <!-- 仙后座 -->
      <g opacity="0.53">
        <line x1="1100" y1="100" x2="1130" y2="160" stroke="url(#constLineGrad2)" stroke-width="0.55"/>
        <line x1="1130" y1="160" x2="1160" y2="110" stroke="url(#constLineGrad1)" stroke-width="0.55"/>
        <line x1="1160" y1="110" x2="1190" y2="170" stroke="url(#constLineGrad2)" stroke-width="0.55"/>
        <line x1="1190" y1="170" x2="1220" y2="120" stroke="url(#constLineGrad1)" stroke-width="0.55"/>
        <circle cx="1100" cy="100" r="2.5" fill="#8098d0" filter="url(#starGlowFilter)"/>
        <circle cx="1130" cy="160" r="3.2" fill="#98b0e0" filter="url(#starGlowBright)"/>
        <circle cx="1160" cy="110" r="2.2" fill="#7090c0" filter="url(#starGlowFilter)"/>
        <circle cx="1190" cy="170" r="2.8" fill="#b8a0e0" filter="url(#starGlowFilter)"/>
        <circle cx="1220" cy="120" r="2.0" fill="#6888b8" filter="url(#starGlowFilter)"/>
      </g>
      <!-- 北斗七星 -->
      <g opacity="0.56">
        <line x1="60"  y1="550" x2="130" y2="520" stroke="url(#constLineGrad4)" stroke-width="0.6"/>
        <line x1="130" y1="520" x2="200" y2="480" stroke="url(#constLineGrad4)" stroke-width="0.6"/>
        <line x1="200" y1="480" x2="260" y2="510" stroke="url(#constLineGrad4)" stroke-width="0.6"/>
        <line x1="260" y1="510" x2="230" y2="580" stroke="url(#constLineGrad4)" stroke-width="0.6"/>
        <line x1="230" y1="580" x2="180" y2="620" stroke="url(#constLineGrad4)" stroke-width="0.6"/>
        <line x1="180" y1="620" x2="130" y2="580" stroke="url(#constLineGrad4)" stroke-width="0.6"/>
        <line x1="130" y1="580" x2="130" y2="520" stroke="url(#constLineGrad2)" stroke-width="0.4" stroke-dasharray="3 6"/>
        <circle cx="60"  cy="550" r="2.0" fill="#6888b8" filter="url(#starGlowFilter)"/>
        <circle cx="130" cy="520" r="3.0" fill="#80a8d8" filter="url(#starGlowBright)"/>
        <circle cx="200" cy="480" r="2.2" fill="#7098c8" filter="url(#starGlowFilter)"/>
        <circle cx="260" cy="510" r="1.8" fill="#6080b0" filter="url(#starGlowFilter)"/>
        <circle cx="230" cy="580" r="2.5" fill="#7898c8" filter="url(#starGlowFilter)"/>
        <circle cx="180" cy="620" r="1.8" fill="#6080b0" filter="url(#starGlowFilter)"/>
        <circle cx="130" cy="580" r="2.0" fill="#6890b8" filter="url(#starGlowFilter)"/>
      </g>
      <!-- 小三角星座 -->
      <g opacity="0.50">
        <line x1="1050" y1="600" x2="1100" y2="560" stroke="url(#constLineGrad3)" stroke-width="0.5"/>
        <line x1="1100" y1="560" x2="1160" y2="580" stroke="url(#constLineGrad3)" stroke-width="0.5"/>

    </svg>
  </div>

  <!-- ════════════════════════════════════════════
       教师工作台 · Constellation Prism
       ════════════════════════════════════════════ -->
  <div class="teacher-layout">
    <!-- 侧边导航 — 毛玻璃风格 -->
    <aside class="teacher-sidebar" x-data>
      <div class="teacher-brand">
        <span class="gradient-text" style="font-size:14px;font-weight:var(--font-bold)">星识教师端</span>
      </div>
      <nav class="teacher-nav">
        <a class="teacher-nav-item active" href="/teacher-dashboard.html">
          <span>📊</span> 工作台
        </a>
        <a class="teacher-nav-item" href="/teacher-class.html">
          <span>👥</span> 班级管理
        </a>
        <a class="teacher-nav-item" href="/teacher-manage.html">
          <span>📝</span> 题库管理
        </a>
        <a class="teacher-nav-item" href="/teacher-exam.html">
          <span>📋</span> 考试管理
        </a>
        <a class="teacher-nav-item" href="/teacher-content.html">
          <span>📚</span> 内容管理
        </a>
        <a class="teacher-nav-item" href="/data-dashboard.html">
          <span>📈</span> 数据大屏
        </a>
      </nav>
      <div class="teacher-sidebar-footer">
        <button class="teacher-logout-btn" @click="Auth.logout()">退出登录</button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="teacher-main" x-data="teacherDashboard" x-init="init()">
      <h1 class="teacher-page-title animate-fade-in-up">工作台</h1>

      <!-- Stat Cards -->
      <div class="td-stats animate-fade-in-up animate-delay-1">
        <div class="stat-card">
          <div class="prism-corner prism-corner-tr"><div class="prism-layer"></div></div>
          <div class="stat-value" x-text="stats.classes"></div>
          <div class="stat-label">授课班级</div>
        </div>
        <div class="stat-card">
          <div class="prism-corner prism-corner-tr"><div class="prism-layer"></div></div>
          <div class="stat-value" x-text="stats.courses"></div>
          <div class="stat-label">在授课程</div>
        </div>
        <div class="stat-card">
          <div class="prism-corner prism-corner-tr"><div class="prism-layer"></div></div>
          <div class="stat-value" x-text="stats.pendingReviews"></div>
          <div class="stat-label">待批改</div>
        </div>
        <div class="stat-card">
          <div class="prism-corner prism-corner-tr"><div class="prism-layer"></div></div>
          <div class="stat-value" x-text="stats.avgScore"></div>
          <div class="stat-label">平均成绩</div>
        </div>
      </div>

      <!-- Chart Row -->
      <div class="td-chart-row animate-fade-in-up animate-delay-2">
        <div class="td-chart-box" x-ref="barChart" style="min-height:300px">
          <div class="prism-corner prism-corner-tr"><div class="prism-layer"></div></div>
          <div class="prism-corner prism-corner-bl"><div class="prism-layer"></div></div>
        </div>
        <div class="td-chart-box" x-ref="radarChart" style="min-height:300px">
          <div class="prism-corner prism-corner-tr"><div class="prism-layer"></div></div>
          <div class="prism-corner prism-corner-bl"><div class="prism-layer"></div></div>
        </div>
      </div>

      <!-- Bottom Row: Tasks + AI -->
      <div class="td-chart-row animate-fade-in-up animate-delay-3">
        <div class="td-chart-box">
          <div class="prism-corner prism-corner-tr"><div class="prism-layer"></div></div>
          <h3>📋 最近任务</h3>
          <template x-if="recentTasks.length === 0">
            <div class="empty-state">暂无待处理任务</div>
          </template>
          <template x-for="task in recentTasks" :key="task.id || task.title">
            <div style="padding:10px 0;border-bottom:1px solid color-mix(in oklch,var(--info),transparent 93%);display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:14px;font-weight:500" x-text="task.title"></div>
                <div style="font-size:12px;color:var(--text-tertiary)" x-text="task.subtitle || ''"></div>
              </div>
              <span class="status-badge" :class="'status-badge-' + (task.status === 'pending' ? 'pending' : task.status === 'done' ? 'approved' : 'draft')" x-text="getTaskStatusLabel(task.status)"></span>
            </div>
          </template>
        </div>

        <div class="td-chart-box">
          <div class="prism-corner prism-corner-tr"><div class="prism-layer"></div></div>
          <h3>💡 AI 教学建议</h3>
          <template x-if="aiSuggestions.length === 0">
            <div class="empty-state">暂无AI建议</div>
          </template>
          <div class="ai-suggestions">
            <template x-for="s in aiSuggestions" :key="s.id || s.text">
              <div class="ai-suggestion-item">
                <span class="ai-suggestion-icon" x-text="s.icon || '💡'"></span>
                <span class="ai-suggestion-text" x-text="s.text"></span>
                <button x-show="s.action_url" @click="window.location.href=s.action_url" class="btn-sm ai-suggestion-action">查看</button>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- My Classes -->
      <h2 style="font-size:16px;margin:24px 0 12px;color:var(--cp-text-primary);font-weight:var(--font-bold)">我的班级</h2>
      <div class="class-grid">
        <template x-for="c in classes" :key="c.id">
          <div class="class-card">
            <div class="prism-corner prism-corner-tr"><div class="prism-layer"></div></div>
            <div class="class-card-header">
              <h3 x-text="c.name"></h3>
              <span class="status-badge" :class="'status-badge-' + (c.status === 'active' ? 'published' : 'draft')" x-text="c.status || 'active'"></span>
            </div>
            <div class="class-card-meta">
              <span x-text="c.subject || '未设置科目'"></span>
              <span style="margin-left:12px" x-text="(c.student_count||0) + ' 名学生'"></span>
              <span x-show="c.avg_score" style="margin-left:12px" x-text="'均分 ' + c.avg_score"></span>
            </div>
            <a :href="'/teacher-class.html?id=' + c.id" class="btn-sm">管理</a>
          </div>
        </template>
        <div x-show="classes.length === 0" class="empty-state">暂无班级，前往<a href="/teacher-class.html" style="color:var(--accent)">班级管理</a>创建</div>
      </div>
    </main>
  </div>
</body>
</html>
