<!DOCTYPE html>
<html data-bg-unified="true" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星识 Star-Learn - 学习日历</title>
    <script defer src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app-base.css">
    <link rel="stylesheet" href="/css/app-bg.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/animations.css">
    <link rel="stylesheet" href="/css/calendar.css">
</head>
<body data-bg-unified="true" class="app-body calendar-body">
    <!-- 统一背景层 -->
    <div id="app-bg" class="app-bg-layer">
        <div class="app-bg-stars"></div>
        <div class="app-bg-nebula"></div>
        <div class="app-bg-orb app-bg-orb-1"></div>
        <div class="app-bg-orb app-bg-orb-2"></div>
        <div class="app-bg-orb app-bg-orb-3"></div>
    </div>

    <!-- 顶部导航 -->
    <nav class="calendar-nav">
        <div class="nav-container">
            <a href="/hub.html" class="nav-back" aria-label="返回中枢">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                <span>返回中枢</span>
            </a>
            <h1 class="nav-title">学习日历</h1>
            <div class="nav-actions">
                <button class="nav-btn" id="add-event-btn" type="button" aria-label="添加学习计划">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主体 -->
    <main class="calendar-main">
        <div class="calendar-layout">
            <!-- 左侧：日历 -->
            <section class="calendar-section" aria-label="月历">
                <header class="month-header">
                    <button class="month-nav-btn" id="prev-month" type="button" aria-label="上个月">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <h2 class="month-title" id="month-title">学习日历</h2>
                    <button class="month-nav-btn" id="next-month" type="button" aria-label="下个月">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                        </svg>
                    </button>
                </header>

                <div class="calendar-grid" id="calendar-grid">
                    <div class="calendar-weekday">日</div>
                    <div class="calendar-weekday">一</div>
                    <div class="calendar-weekday">二</div>
                    <div class="calendar-weekday">三</div>
                    <div class="calendar-weekday">四</div>
                    <div class="calendar-weekday">五</div>
                    <div class="calendar-weekday">六</div>
                </div>

                <div class="calendar-legend">
                    <div class="legend-item"><span class="legend-dot completed"></span><span>已完成</span></div>
                    <div class="legend-item"><span class="legend-dot partial"></span><span>部分完成</span></div>
                    <div class="legend-item"><span class="legend-dot today"></span><span>今日</span></div>
                    <div class="legend-item"><span class="legend-dot future"></span><span>已计划</span></div>
                </div>
            </section>

            <!-- 右侧：详情 / 计划 -->
            <aside class="schedule-section">
                <div class="stats-summary stagger">
                    <div class="summary-card fade-up">
                        <span class="summary-value" id="study-days">0</span>
                        <span class="summary-label">本月学习天数</span>
                    </div>
                    <div class="summary-card fade-up">
                        <span class="summary-value" id="total-hours-month">0.0</span>
                        <span class="summary-label">学习时长 (h)</span>
                    </div>
                    <div class="summary-card fade-up">
                        <span class="summary-value" id="completed-tasks">0</span>
                        <span class="summary-label">完成任务数</span>
                    </div>
                </div>

                <div class="day-detail-card fade-in" id="day-detail">
                    <div class="detail-header">
                        <h3 class="detail-title" id="detail-date">选择日期</h3>
                        <span class="detail-subtitle" id="detail-day">查看当日学习计划</span>
                    </div>
                    <div class="detail-content" id="detail-content">
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <p>点击左侧日历中的日期<br>查看当日学习详情</p>
                        </div>
                    </div>
                </div>

                <div class="upcoming-section">
                    <h3 class="section-title">近期学习计划</h3>
                    <div class="events-list" id="events-list">
                        <div class="empty-state">正在加载学习计划...</div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <!-- 添加计划弹窗 -->
    <div class="modal-overlay hidden" id="event-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title">添加学习计划</h3>
                <button class="modal-close" id="close-modal" type="button" aria-label="关闭">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <form class="event-form" id="event-form">
                <div class="form-group">
                    <label class="form-label" for="event-title">学习内容</label>
                    <input type="text" class="form-input" placeholder="输入学习主题" id="event-title" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="event-date">日期</label>
                        <input type="date" class="form-input" id="event-date" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="event-duration">时长</label>
                        <select class="form-input" id="event-duration">
                            <option value="1">1 小时</option>
                            <option value="2">2 小时</option>
                            <option value="3" selected>3 小时</option>
                            <option value="4">4 小时</option>
                            <option value="5">5 小时</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <span class="form-label">分类</span>
                    <div class="category-options">
                        <label class="category-option">
                            <input type="radio" name="event-category" value="python" checked>
                            <span class="category-tag python">🐍 Python</span>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="event-category" value="algorithm">
                            <span class="category-tag algorithm">🧮 算法</span>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="event-category" value="database">
                            <span class="category-tag database">🗄️ 数据库</span>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="event-category" value="web">
                            <span class="category-tag web">🌐 Web</span>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="event-category" value="ai">
                            <span class="category-tag ai">🤖 AI</span>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="event-desc">备注</label>
                    <textarea class="form-textarea" placeholder="添加备注信息..." id="event-desc" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancel-btn">取消</button>
                    <button type="submit" class="btn-submit">添加计划</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/data-layer.js"></script>
    <script src="/js/calendar.js"></script>
</body>
</html>
