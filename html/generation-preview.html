<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程生成中 - 星识</title>
    <link rel="stylesheet" href="../css/generation-preview.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Background Decor -->
    <div class="bg-decor">
        <div class="bg-blob bg-blob-blue"></div>
        <div class="bg-blob bg-blob-purple"></div>
    </div>

    <!-- Starlight Particles -->
    <div class="particle-bg">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div id="generation-preview" class="preview-page">
        <!-- Back Button -->
        <button id="back-btn" class="back-button">
            <i class="fas fa-arrow-left"></i>
            <span>返回首页</span>
        </button>

        <!-- Main Content Wrapper -->
        <div class="content-wrapper">
            <!-- Main Card -->
            <div class="main-card">
                <!-- Progress Dots -->
                <div class="progress-dots" id="progress-dots">
                    <div class="dot" data-step="0"></div>
                    <div class="dot" data-step="1"></div>
                    <div class="dot" data-step="2"></div>
                    <div class="dot" data-step="3"></div>
                    <div class="dot" data-step="4"></div>
                    <div class="dot" data-step="5"></div>
                    <div class="dot" data-step="6"></div>
                </div>

                <!-- Visualizer Container -->
                <div class="visualizer-container" id="visualizer-container">
                    <!-- Error State -->
                    <div class="visualizer viz-error" id="viz-error" style="display: none;">
                        <div class="error-visualizer">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                    </div>

                    <!-- Complete State -->
                    <div class="visualizer viz-complete" id="viz-complete" style="display: none;">
                        <div class="complete-visualizer">
                            <i class="fas fa-check-circle"></i>
                        </div>
                    </div>

                    <!-- PDF Analysis -->
                    <div class="visualizer viz-pdf" id="viz-pdf">
                        <div class="pdf-visualizer">
                            <div class="pdf-glow"></div>
                            <div class="pdf-doc">
                                <div class="pdf-line"></div>
                                <div class="pdf-line"></div>
                                <div class="pdf-line"></div>
                                <div class="pdf-line"></div>
                                <div class="pdf-line"></div>
                                <div class="pdf-scan-line"></div>
                            </div>
                            <div class="pdf-icon">
                                <i class="fas fa-expand"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Requirement Analysis -->
                    <div class="visualizer viz-requirement-analysis" id="viz-requirement-analysis" style="display: none;">
                        <div class="pdf-visualizer">
                            <div class="pdf-glow"></div>
                            <div class="pdf-doc">
                                <div class="pdf-line"></div>
                                <div class="pdf-line"></div>
                                <div class="pdf-line"></div>
                                <div class="pdf-line"></div>
                                <div class="pdf-line"></div>
                                <div class="pdf-scan-line"></div>
                            </div>
                            <div class="pdf-icon">
                                <i class="fas fa-lightbulb"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Web Search -->
                    <div class="visualizer viz-search" id="viz-search" style="display: none;">
                        <div class="search-visualizer">
                            <div class="search-glow"></div>
                            <div class="search-card">
                                <div class="search-header">
                                    <i class="fas fa-search"></i>
                                    <div class="search-bar">
                                        <div class="search-bar-fill"></div>
                                    </div>
                                </div>
                                <div class="search-results" id="search-results">
                                    <div class="search-result-item">
                                        <div class="result-title"></div>
                                        <div class="result-url"></div>
                                    </div>
                                    <div class="search-result-item">
                                        <div class="result-title"></div>
                                        <div class="result-url"></div>
                                    </div>
                                    <div class="search-result-item">
                                        <div class="result-title"></div>
                                        <div class="result-url"></div>
                                    </div>
                                </div>
                                <div class="search-scan"></div>
                            </div>
                            <div class="source-badge" id="source-badge" style="display: none;">
                                <i class="fas fa-globe"></i>
                                <span id="source-count">0</span>
                            </div>
                        </div>
                    </div>

                    <!-- Outline -->
                    <div class="visualizer viz-outline" id="viz-outline" style="display: none;">
                        <div class="outline-visualizer">
                            <div class="outline-card">
                                <div class="outline-header">
                                    <span>课程大纲</span>
                                </div>
                                <div class="outline-content" id="outline-list-preview">
                                    <div class="outline-placeholder">
                                        <div class="outline-placeholder-line"></div>
                                        <div class="outline-placeholder-line"></div>
                                        <div class="outline-placeholder-line"></div>
                                        <div class="outline-placeholder-line"></div>
                                    </div>
                                </div>
                            </div>
                            <div class="live-dot"></div>
                        </div>
                    </div>

                    <!-- Agent Generation -->
                    <div class="visualizer viz-ai" id="viz-ai" style="display: none;">
                        <div class="agent-visualizer">
                            <div class="float-card">?</div>
                            <div class="float-card">?</div>
                            <div class="float-card">?</div>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="visualizer viz-content" id="viz-content" style="display: none;">
                        <div class="content-visualizer">
                            <div class="orbit-ring"></div>
                            <div class="orbit-ring"></div>
                            <div class="content-glow"></div>
                            <div class="content-card">
                                <div class="type-badge" id="content-type-badge">SLIDE</div>
                                <i class="fas fa-file-powerpoint content-icon"></i>
                                <div class="content-lines">
                                    <div class="content-line"></div>
                                    <div class="content-line"></div>
                                    <div class="content-line"></div>
                                    <div class="content-line"></div>
                                </div>
                                <div class="content-scan"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="visualizer viz-actions" id="viz-actions" style="display: none;">
                        <div class="actions-visualizer">
                            <div class="actions-glow"></div>
                            <div class="actions-card">
                                <div class="actions-header">
                                    <i class="fas fa-clapperboard"></i>
                                    <div class="actions-title">
                                        <div class="actions-title-fill"></div>
                                    </div>
                                </div>
                                <div class="actions-list">
                                    <div class="action-item" data-index="0">
                                        <div class="action-icon"><i class="fas fa-comment"></i></div>
                                        <div class="action-label"></div>
                                        <div class="action-dot"></div>
                                    </div>
                                    <div class="action-item" data-index="1">
                                        <div class="action-icon"><i class="fas fa-eye"></i></div>
                                        <div class="action-label"></div>
                                        <div class="action-dot"></div>
                                    </div>
                                    <div class="action-item" data-index="2">
                                        <div class="action-icon"><i class="fas fa-comment"></i></div>
                                        <div class="action-label"></div>
                                        <div class="action-dot"></div>
                                    </div>
                                    <div class="action-item" data-index="3">
                                        <div class="action-icon"><i class="fas fa-play"></i></div>
                                        <div class="action-label"></div>
                                        <div class="action-dot"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Status Text -->
                <div class="status-text">
                    <h2 id="status-title" class="status-title">正在分析需求...</h2>
                    <p id="status-desc" class="status-desc">星识AI正在为你准备个性化的课程内容</p>
                </div>

                <!-- AI教师分配展示 -->
                <div id="teacher-assign-display" class="teacher-assign-display" style="display: none;">
                    <div class="teacher-assign-badge">
                        <span class="teacher-assign-icon"></span>
                        <span class="teacher-assign-name"></span>
                        <span class="teacher-assign-profession"></span>
                    </div>
                    <div class="teacher-assign-detail">
                        <span class="teacher-personality"></span>
                        <span class="teacher-style"></span>
                    </div>
                    <div class="teacher-match-reason"></div>
                </div>

                <!-- Feature Cards -->
                <div class="feature-cards" id="feature-cards">
                    <!-- Dynamically populated based on enabled features -->
                </div>

                <!-- Warning Badge -->
                <div class="warning-badge" id="warning-badge">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="warning-text"></span>
                </div>
            </div>

            <!-- Footer Hint -->
            <div class="footer-hint" id="footer-hint">
                <i class="fas fa-sparkles"></i>
                <span>AI工作中</span>
            </div>

            <!-- Retry Button -->
            <button id="retry-btn" class="retry-button">
                <i class="fas fa-redo"></i>
                <span>重试</span>
            </button>
        </div>

        <!-- Abort Button (Fixed Top Right) -->
        <button id="abort-btn" class="abort-button">
            <i class="fas fa-stop"></i>
            <span>停止生成</span>
        </button>
    </div>

    <script src="../js/generation-preview.js"></script>
</body>
</html>
