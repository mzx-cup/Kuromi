<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂学习 - 星识</title>
    <link rel="stylesheet" href="../css/classroom.css">
    <link rel="stylesheet" href="../css/link-renderer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
    .sync-progress-container {
        width: 60px;
        height: 4px;
        background: rgba(255,255,255,0.2);
        border-radius: 2px;
        overflow: hidden;
    }

    .sync-progress {
        height: 100%;
        background: linear-gradient(90deg, var(--success), var(--success-light));
        transition: width 0.1s linear;
        border-radius: 2px;
    }

    .teacher-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .teacher-name {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
    }

    .teacher-status {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        animation: pulse 2s infinite;
    }

    .status-text {
        font-size: 11px;
        color: var(--text-secondary);
    }

    .header-voice-select {
        background: var(--surface-glass);
        border: 1px solid var(--glass-border);
        border-radius: 8px;
        padding: 6px 12px;
        color: var(--text-primary);
        font-size: 12px;
        cursor: pointer;
        outline: none;
    }

    .header-voice-select:hover {
        border-color: var(--primary);
    }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="classroom-bg"></div>

    <div id="classroom-page" class="classroom">
        <!-- Header -->
        <header class="classroom-header">
            <div class="header-left">
                <button id="toggle-sidebar" class="icon-btn" title="切换侧边栏">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="course-title" id="course-title">
                    <i class="fas fa-graduation-cap"></i>
                    <span>课程加载中...</span>
                </div>
            </div>
            <div class="header-right">
                <div class="speech-sync-indicator" id="speech-sync" style="display:none;">
                    <div class="sync-dot"></div>
                    <span class="sync-text">讲解中...</span>
                    <div class="sync-progress-container">
                        <div class="sync-progress" style="width:0%"></div>
                    </div>
                </div>
                <button id="voice-btn" class="icon-btn voice-btn" title="语音播放">
                    <i class="fas fa-volume-up"></i>
                </button>
                <div class="voice-select-wrapper" id="voice-select-wrapper" style="display:none;">
                    <select id="header-voice-select" class="header-voice-select">
                        <option value="female-shaonv">青春少女</option>
                        <option value="female-yujie" selected>温柔御姐</option>
                        <option value="female-danyun">知性女声</option>
                        <option value="male-qingshu">青涩少年</option>
                        <option value="male-shaoshuai">磁性男声</option>
                    </select>
                </div>
                <button id="settings-btn" class="icon-btn" title="设置">
                    <i class="fas fa-cog"></i>
                </button>
                <button id="exit-btn" class="icon-btn exit-btn" title="退出课堂">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- Body -->
        <div class="classroom-body">
            <!-- Scene Sidebar -->
            <aside class="scene-sidebar" id="scene-sidebar">
                <button class="whiteboard-toggle-btn" id="whiteboard-toggle-btn" title="切换白板">
                    <i class="fas fa-pencil-alt"></i>
                    <span>白板</span>
                </button>
                <button class="quiz-toggle-btn" id="quiz-toggle-btn" title="课堂测验">
                    <i class="fas fa-question-circle"></i>
                    <span>测验</span>
                </button>
                <div class="scene-thumbnails" id="scene-thumbnails"></div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <div class="slide-viewer">
                    <!-- Slide Container -->
                    <div class="slide-container" id="slide-container"></div>

                    <!-- Whiteboard Container -->
                    <div class="whiteboard-container" id="whiteboard-container" style="display:none;">
                        <div class="whiteboard-toolbar" id="whiteboard-toolbar">
                            <span class="whiteboard-label">
                                <i class="fas fa-pencil-alt"></i> 白板
                            </span>
                            <div class="whiteboard-toolbar-actions">
                                <div class="wb-pen-group" id="wb-pen-group" style="display:none;">
                                    <button class="whiteboard-tool-btn" id="wb-pen-toggle-btn" title="画笔模式">
                                        <i class="fas fa-pen"></i>
                                    </button>
                                    <button class="whiteboard-tool-btn" id="wb-eraser-btn" title="橡皮擦">
                                        <i class="fas fa-eraser"></i>
                                    </button>
                                    <div class="wb-pen-colors">
                                        <button class="wb-pen-color active" data-color="#1e293b" style="background:#1e293b;" title="黑色"></button>
                                        <button class="wb-pen-color" data-color="#ef4444" style="background:#ef4444;" title="红色"></button>
                                        <button class="wb-pen-color" data-color="#3b82f6" style="background:#3b82f6;" title="蓝色"></button>
                                        <button class="wb-pen-color" data-color="#10b981" style="background:#10b981;" title="绿色"></button>
                                        <button class="wb-pen-color" data-color="#f59e0b" style="background:#f59e0b;" title="橙色"></button>
                                        <button class="wb-pen-color" data-color="#8b5cf6" style="background:#8b5cf6;" title="紫色"></button>
                                        <button class="wb-pen-color" data-color="#ec4899" style="background:#ec4899;" title="粉色"></button>
                                        <button class="wb-pen-color" data-color="#06b6d4" style="background:#06b6d4;" title="青色"></button>
                                        <button class="wb-pen-color" data-color="#84cc16" style="background:#84cc16;" title="黄绿"></button>
                                        <button class="wb-pen-color" data-color="#ffffff" style="background:#ffffff;" title="白色"></button>
                                    </div>
                                    <input type="range" class="wb-pen-width" id="wb-pen-width" min="1" max="20" value="3" title="画笔粗细">
                                    <button class="whiteboard-tool-btn" id="wb-pen-undo-btn" title="撤销">
                                        <i class="fas fa-undo"></i>
                                    </button>
                                </div>
                                <button class="whiteboard-tool-btn" id="wb-text-btn" title="文字">
                                    <i class="fas fa-font"></i>
                                </button>
                                <button class="whiteboard-tool-btn" id="wb-ai-draw-btn" title="AI 绘图">
                                    <i class="fas fa-magic"></i>
                                </button>
                                <button class="whiteboard-tool-btn" id="wb-theme-btn" title="切换主题">
                                    <i class="fas fa-adjust"></i>
                                </button>
                                <button class="whiteboard-tool-btn" id="wb-clear-btn" title="清空白板">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="whiteboard-stage" id="whiteboard-stage"></div>
                    </div>

                    <!-- Quiz Container -->
                    <div class="quiz-container" id="quiz-container" style="display:none;">
                        <div class="quiz-header" id="quiz-header"></div>
                        <div class="quiz-options" id="quiz-questions"></div>
                        <div class="quiz-result" id="quiz-result" style="display:none;"></div>
                        <button class="quiz-submit-btn" id="quiz-submit-btn" style="display:none;">
                            <span>提交答案</span>
                        </button>
                    </div>

                    <!-- Exercise Container -->
                    <div class="exercise-container" id="exercise-container" style="display:none;">
                        <div class="exercise-content" id="exercise-content"></div>
                        <div class="exercise-hints" id="exercise-hints" style="display:none;"></div>
                        <textarea class="exercise-answer" id="exercise-answer" placeholder="在此输入你的答案..."></textarea>
                        <button class="exercise-submit-btn" id="exercise-submit-btn">提交答案</button>
                    </div>

                    <!-- Interactive Container -->
                    <div class="interactive-container" id="interactive-container" style="display:none;">
                        <iframe id="interactive-iframe" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
                    </div>

                    <!-- Action Overlay -->
                    <div class="action-overlay" id="action-overlay">
                        <div class="spotlight-beam" id="spotlight-beam" style="display:none;"></div>
                        <div class="laser-dot" id="laser-dot" style="display:none;"></div>
                    </div>

                    <!-- Quiz Popup Overlay -->
                    <div class="quiz-popup-overlay" id="quiz-popup-overlay" style="display:none;">
                        <div class="quiz-popup-backdrop"></div>
                        <div class="quiz-popup-card">
                            <button class="quiz-popup-close" id="quiz-popup-close">
                                <i class="fas fa-times"></i>
                            </button>

                            <!-- Cover Phase -->
                            <div class="quiz-cover" id="quiz-cover">
                                <div class="quiz-cover-icon">
                                    <i class="fas fa-question-circle"></i>
                                </div>
                                <h2 class="quiz-cover-title" id="quiz-cover-title">课堂测验</h2>
                                <div class="quiz-cover-meta" id="quiz-cover-meta"></div>
                                <button class="quiz-start-btn" id="quiz-start-btn">
                                    <i class="fas fa-play"></i> 开始答题
                                </button>
                            </div>

                            <!-- Answering Phase -->
                            <div class="quiz-questions-area" id="quiz-questions-area" style="display:none;"></div>

                            <!-- Grading Phase -->
                            <div class="quiz-grading" id="quiz-grading" style="display:none;">
                                <div class="quiz-grading-spinner"></div>
                                <p class="quiz-grading-text" id="quiz-grading-text">AI 正在批改你的答案...</p>
                                <div class="grading-progress-list" id="grading-progress-list"></div>
                            </div>

                            <!-- Reviewing Phase -->
                            <div class="quiz-review-area" id="quiz-review-area" style="display:none;"></div>

                            <!-- Footer -->
                            <div class="quiz-popup-footer" id="quiz-popup-footer" style="display:none;">
                                <button class="quiz-footer-btn quiz-submit-btn" id="quiz-popup-submit-btn">
                                    <i class="fas fa-check"></i> 提交答案
                                </button>
                                <button class="quiz-footer-btn quiz-retry-btn" id="quiz-popup-retry-btn" style="display:none;">
                                    <i class="fas fa-redo"></i> 重新作答
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- AI Teacher Area - Fixed Bottom Right -->
                <div class="teacher-area minimized" id="teacher-area" data-state="minimized">
                    <div class="teacher-avatar" id="teacher-avatar">
                        <div class="teacher-avatar-inner">
                            <div class="teacher-avatar-eyes">
                                <div class="eye eye-left"></div>
                                <div class="eye eye-right"></div>
                            </div>
                            <div class="teacher-avatar-mouth"></div>
                        </div>
                    </div>
                    <div class="teacher-info">
                        <span class="teacher-name" id="teacher-name">AI教师</span>
                        <div class="teacher-status" id="teacher-status">
                            <span class="status-dot"></span>
                            <span class="status-text">待机中</span>
                        </div>
                    </div>
                    <div class="teacher-speech-wrapper">
                        <div class="speech-bubble">
                            <p id="speech-text" class="full-text">正在加载课程内容...</p>
                            <p class="mini-text">正在加载课程内容...</p>
                        </div>
                        <div class="teacher-controls" id="teacher-controls" style="display:flex;align-items:center;gap:8px;">
                            <button class="speech-btn playback-play-btn" id="playback-play-btn" title="播放 / 暂停" data-shortcut="Space">
                                <i class="fas fa-play"></i>
                            </button>
                            <div class="playback-speed-wrap" id="playback-speed-wrap">
                                <button class="speech-btn speed-btn" id="speed-btn" title="语速调节">
                                    <span class="speed-label">1x</span>
                                    <i class="fas fa-caret-down speed-caret"></i>
                                </button>
                                <div class="speed-menu" id="speed-menu" style="display:none;">
                                    <div class="speed-option" data-speed="0.5">0.5x</div>
                                    <div class="speed-option" data-speed="0.75">0.75x</div>
                                    <div class="speed-option active" data-speed="1.0">1x</div>
                                    <div class="speed-option" data-speed="1.25">1.25x</div>
                                    <div class="speed-option" data-speed="1.5">1.5x</div>
                                    <div class="speed-option" data-speed="2.0">2x</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Slide Controls -->
                <div class="slide-controls">
                    <button class="nav-btn" id="prev-slide">
                        <i class="fas fa-chevron-left"></i>
                        <span>上一页</span>
                    </button>
                    <div class="slide-indicator">
                        <span id="current-slide">1</span>
                        <span class="separator">/</span>
                        <span id="total-slides">0</span>
                    </div>
                    <button class="nav-btn" id="next-slide">
                        <span>下一页</span>
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Progress Bar -->
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </main>

        <!-- Floating Chat Toggle Button -->
        <button class="chat-toggle-btn" id="chat-toggle-btn" title="课堂讨论">
            <i class="fas fa-comment-dots"></i>
        </button>

        <!-- Chat Panel -->
        <aside class="chat-panel collapsed" id="chat-panel">
            <div class="chat-header">
                <i class="fas fa-comments"></i>
                <span>课堂讨论</span>
                <div class="chat-tabs">
                    <button class="chat-tab active" data-tab="qa">问答</button>
                    <button class="chat-tab" data-tab="discussion">讨论</button>
                </div>
            </div>

            <!-- QA Mode Messages -->
            <div class="chat-messages" id="chat-messages"></div>

            <!-- Discussion Mode -->
            <div class="discussion-area" id="discussion-area" style="display:none;">
                <div class="discussion-messages" id="discussion-messages"></div>
                <div class="discussion-actions">
                    <button class="discussion-start-btn" id="discussion-start-btn">
                        <i class="fas fa-plus"></i> 发起讨论
                    </button>
                </div>
            </div>

            <div class="chat-input-area">
                <button class="voice-input-btn" id="chat-voice-btn" title="语音输入">
                    <i class="fas fa-microphone"></i>
                </button>
                <input type="text" id="chat-input" placeholder="向老师提问..." autocomplete="off">
                <button class="send-btn" id="send-chat" style="display:none;">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </aside>

        <!-- Audio Player -->
        <audio id="tts-audio-player" preload="auto" style="display:none;"></audio>

        <!-- Completion Overlay -->
        <div class="completion-overlay" id="completion-overlay" style="display:none;">
            <canvas id="confetti-canvas"></canvas>
            <div class="completion-card">
                <div class="completion-trophy">
                    <svg viewBox="0 0 120 150" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="gold-grad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#fef3c7"/>
                                <stop offset="35%" stop-color="#fbbf24"/>
                                <stop offset="75%" stop-color="#d97706"/>
                                <stop offset="100%" stop-color="#92400e"/>
                            </linearGradient>
                        </defs>
                        <path d="M 28 32 Q 6 32 8 60 Q 10 82 32 86" fill="none" stroke="url(#gold-grad)" stroke-width="7" stroke-linecap="round"/>
                        <path d="M 92 32 Q 114 32 112 60 Q 110 82 88 86" fill="none" stroke="url(#gold-grad)" stroke-width="7" stroke-linecap="round"/>
                        <path d="M 25 18 L 95 18 L 95 50 Q 95 90 60 100 Q 25 90 25 50 Z" fill="url(#gold-grad)"/>
                        <ellipse cx="60" cy="19" rx="36" ry="4.5" fill="#fde68a"/>
                        <path d="M 60 42 L 63.6 52.3 L 74.5 52.3 L 65.7 58.7 L 69 69 L 60 62.7 L 51 69 L 54.3 58.7 L 45.5 52.3 L 56.4 52.3 Z" fill="#ffffff" opacity="0.92"/>
                        <path d="M 52 100 L 68 100 L 66 116 L 54 116 Z" fill="url(#gold-grad)"/>
                        <rect x="40" y="116" width="40" height="7" rx="2" fill="#fbbf24"/>
                        <rect x="32" y="123" width="56" height="9" rx="2" fill="url(#gold-grad)"/>
                        <rect x="28" y="132" width="64" height="6" rx="3" fill="#fbbf24"/>
                    </svg>
                </div>
                <h2 class="completion-title">课堂完成！</h2>
                <p class="completion-subtitle" id="completion-subtitle"></p>
                <div class="completion-stats" id="completion-stats"></div>
                <div class="completion-badges" id="completion-badges"></div>
                <div class="completion-next" id="completion-next"></div>
                <button class="completion-back-btn" onclick="location.href='/index.html'">
                    <i class="fas fa-home"></i> 返回首页
                </button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div class="modal" id="settings-modal" style="display: none;">
            <div class="modal-content settings-modal-content">
                <div class="modal-header">
                    <i class="fas fa-cog"></i>
                    <span>设置</span>
                </div>
                <div class="settings-sections">
                    <div class="settings-section">
                        <h3 class="settings-section-title">
                            <i class="fas fa-volume-up"></i> 语音设置
                        </h3>
                        <div class="settings-item">
                            <label class="settings-label">默认音色</label>
                            <select id="settings-voice-select" class="settings-select">
                                <option value="female-shaonv">青春少女</option>
                                <option value="female-yujie" selected>温柔御姐</option>
                                <option value="female-danyun">知性女声</option>
                                <option value="male-qingshu">青涩少年</option>
                                <option value="male-shaoshuai">磁性男声</option>
                            </select>
                        </div>
                        <div class="settings-item">
                            <label class="settings-label">默认语速</label>
                            <select id="settings-speed-select" class="settings-select">
                                <option value="0.5">0.5x</option>
                                <option value="0.75">0.75x</option>
                                <option value="1.0" selected>1.0x</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.5">1.5x</option>
                                <option value="2.0">2.0x</option>
                            </select>
                        </div>
                        <div class="settings-item">
                            <label class="settings-label">自动播放语音</label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="settings-autoplay" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3 class="settings-section-title">
                            <i class="fas fa-desktop"></i> 显示设置
                        </h3>
                        <div class="settings-item">
                            <label class="settings-label">显示进度条</label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="settings-show-progress" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                        <div class="settings-item">
                            <label class="settings-label">显示页码</label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="settings-show-slide-num" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>

                    <div class="settings-section">
                        <h3 class="settings-section-title">
                            <i class="fas fa-bell"></i> 通知设置
                        </h3>
                        <div class="settings-item">
                            <label class="settings-label">新消息通知</label>
                            <label class="toggle-switch">
                                <input type="checkbox" id="settings-notifications" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="cancel-settings">取消</button>
                    <button class="btn btn-primary" id="save-settings">保存</button>
                </div>
            </div>
        </div>

        <!-- Exit Modal -->
        <div class="modal" id="exit-modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>退出课堂</span>
                </div>
                <p class="modal-text">确定要退出课堂吗？学习进度将会保存。</p>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="cancel-exit">取消</button>
                    <button class="btn btn-primary" id="confirm-exit">确定退出</button>
                </div>
            </div>
        </div>
    </div>

    <script>
// Voice select change handlers
document.getElementById('header-voice-select')?.addEventListener('change', function() {
    if (window.classroomController) {
        window.classroomController.setVoice(this.value);
    }
});

document.getElementById('voice-dropdown-trigger')?.addEventListener('click', function() {
    document.getElementById('voice-dropdown-menu').classList.toggle('show');
});

document.querySelectorAll('.voice-dropdown-item').forEach(function(item) {
    item.addEventListener('click', function() {
        const value = this.dataset.value;
        const text = this.textContent;
        document.getElementById('voice-dropdown-value').textContent = text;
        document.getElementById('voice-dropdown-menu').classList.remove('show');
        document.querySelectorAll('.voice-dropdown-item').forEach(i => i.classList.remove('selected'));
        this.classList.add('selected');
        if (window.classroomController) {
            window.classroomController.setVoice(value);
        }
    });
});

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
    if (!e.target.closest('.voice-dropdown')) {
        document.getElementById('voice-dropdown-menu')?.classList.remove('show');
    }
});

// Scene thumbnail click delegation - fix goToScene error
// Remove inline onclick handlers from scene-thumb elements
document.addEventListener('click', function(e) {
    const thumb = e.target.closest('.scene-thumb');
    if (thumb) {
        // Check if this is a scene thumbnail with inline onclick
        const onclickAttr = thumb.getAttribute('onclick');
        if (onclickAttr && onclickAttr.includes('classroomController')) {
            e.stopPropagation();
            const match = onclickAttr.match(/goToScene\((\d+)\)/);
            if (match && window.classroomController) {
                window.classroomController.goToScene(parseInt(match[1], 10));
            }
        } else if (window.classroomController) {
            const index = parseInt(thumb.dataset.index, 10);
            if (!isNaN(index)) {
                window.classroomController.goToScene(index);
            }
        }
    }
});
</script>

<!-- Whiteboard AI Draw Modal -->
<div class="wb-modal-overlay" id="wb-ai-draw-modal" style="display:none;">
    <div class="wb-modal-card">
        <div class="wb-modal-header">
            <span class="wb-modal-title"><i class="fas fa-magic"></i> AI 智能绘图</span>
            <button class="wb-modal-close" id="wb-ai-draw-modal-close"><i class="fas fa-times"></i></button>
        </div>
        <div class="wb-modal-body">
            <div class="wb-modal-desc">
                描述你想绘制的内容，AI 将自动生成精美的白板图形。

            <textarea class="wb-modal-input" id="wb-ai-draw-input" rows="4" placeholder="例如：绘制一个直角三角形，标注三个顶点和直角符号..."></textarea>
            <div class="wb-modal-examples">
                <span class="wb-modal-examples-label">快速示例：</span>
                <button class="wb-modal-example-chip" data-example="绘制一个坐标系并画出 y=x² 的抛物线，标注顶点和开口方向">抛物线</button>
                <button class="wb-modal-example-chip" data-example="绘制一个圆并标注圆心、半径和直径">圆的几何</button>
                <button class="wb-modal-example-chip" data-example="绘制一个流程图：开始 → 输入 → 判断 → 输出 → 结束">流程图</button>
                <button class="wb-modal-example-chip" data-example="绘制一个二叉树，根节点为A，左子节点B，右子节点C">二叉树</button>
            </div>
        </div>
        <div class="wb-modal-footer">
            <button class="wb-modal-btn wb-modal-btn-secondary" id="wb-ai-draw-modal-cancel">取消</button>
            <button class="wb-modal-btn wb-modal-btn-primary" id="wb-ai-draw-modal-submit"><i class="fas fa-wand-magic-sparkles"></i> 开始绘制</button>
        </div>
    </div>
</div>
