<body data-bg-unified="true" class="app-body hub-body">

    <!-- 小星 AI 助手 -->
    <div class="app-kanban" id="app-kanban"></div>

    <div class="dd-page">
        <!-- ===== Header — 指挥条 ===== -->
        <div class="dd-header">
            <div class="dd-header-left">
                <a href="/hub.html" class="dd-back" aria-label="返回中枢">
                    <i data-lucide="arrow-left"></i>
                    <span>返回</span>
                </a>
                <div class="dd-eyebrow dd-eyebrow-chip">
                    <i data-lucide="radio-tower" class="dd-eyebrow-icon"></i>
                    <span class="dd-eyebrow-tag">FLOW&nbsp;RESONANCE</span>
                    <span class="dd-eyebrow-sep">·</span>
                    <span class="dd-eyebrow-dot"></span>
                    <span class="dd-eyebrow-live">实时监测中</span>
                </div>
                <h1 class="dd-title">
                    <span class="dd-title-icon" aria-hidden="true">
                        <i data-lucide="brain-circuit"></i>
                    </span>
                    <span class="dd-title-grad" data-text="心流共振仪">心流共振仪</span>
                    <span class="dd-title-sub" id="fm-greeting">实时专注监测 ✨</span>
                </h1>
                <p class="dd-datetime" id="fm-datetime">
                    <i data-lucide="calendar-clock"></i>
                    <span>--</span>
                </p>
            </div>
            <div class="dd-header-right">
                <div class="dd-status">
                    <span class="dd-status-dot" id="fm-status-dot"></span>
                    <span class="dd-status-text" id="fm-status-text">实时监测中</span>
                </div>
            </div>
        </div>

        <!-- ===== Bento Grid ===== -->
        <div class="dd-bento">

            <!-- ROW A: 3 KPI cards -->
            <section class="fm-bento-stats">

                <article class="app-stat-card fm-kpi-card" data-key="focus" style="--ic: var(--info);">
                    <div class="dd-stat-head">
                        <div class="dd-stat-icon"><i data-lucide="clock-4"></i></div>
                        <div class="dd-stat-trend" id="kpi-focus-trend">—</div>
                    </div>
                    <div class="fm-kpi-value" id="kpi-focus-value">0</div>
                    <div class="fm-kpi-label">今日专注</div>
                    <div class="fm-kpi-bar">
                        <div class="fm-kpi-bar-fill" id="kpi-focus-fill" style="width: 0%;"></div>
                    </div>
                    <div class="fm-kpi-hint" id="kpi-focus-hint">目标 60 分钟</div>
                </article>

                <article class="app-stat-card fm-kpi-card" data-key="score" style="--ic: var(--brand-500);">
                    <div class="dd-stat-head">
                        <div class="dd-stat-icon"><i data-lucide="activity"></i></div>
                        <div class="dd-stat-trend" id="kpi-score-trend">—</div>
                    </div>
                    <div class="fm-kpi-value" id="kpi-score-value">0</div>
                    <div class="fm-kpi-label">心流指数</div>
                    <div class="fm-kpi-bar">
                        <div class="fm-kpi-bar-fill" id="kpi-score-fill" style="width: 0%;"></div>
                    </div>
                    <div class="fm-kpi-hint" id="kpi-score-hint">vs 近3天</div>
                </article>

                <article class="app-stat-card fm-kpi-card" data-key="deep" style="--ic: var(--success);">
                    <div class="dd-stat-head">
                        <div class="dd-stat-icon"><i data-lucide="zap"></i></div>
                        <div class="dd-stat-trend" id="kpi-deep-trend">—</div>
                    </div>
                    <div class="fm-kpi-value" id="kpi-deep-value">0%</div>
                    <div class="fm-kpi-label">深度专注率</div>
                    <div class="fm-kpi-bar">
                        <div class="fm-kpi-bar-fill" id="kpi-deep-fill" style="width: 0%;"></div>
                    </div>
                    <div class="fm-kpi-hint" id="kpi-deep-hint">本周均值 —</div>
                </article>

            </section>

            <!-- ROW B: 2 chart cards side by side -->
            <section class="fm-bento-charts">

                <article class="app-chart-card dd-card fm-card-waveform">
                    <header class="dd-card-head">
                        <div>
                            <h3 class="dd-card-title">📈 实时心流波形</h3>
                            <p class="dd-card-desc">深度 / 轻度 / 走神状态切换</p>
                        </div>
                        <div class="dd-card-tools">
                            <span class="fm-legend-tag fm-tag-deep">深度</span>
                            <span class="fm-legend-tag fm-tag-shallow">轻度</span>
                            <span class="fm-legend-tag fm-tag-distracted">分心</span>
                        </div>
                    </header>
                    <div class="dd-chart" id="waveform-chart"></div>
                </article>

                <article class="app-chart-card dd-card fm-card-timeofday">
                    <header class="dd-card-head">
                        <h3 class="dd-card-title">⏰ 时段专注分布</h3>
                    </header>
                    <div class="dd-chart" id="timeofday-chart"></div>
                </article>

            </section>

            <!-- ROW C: session + tips -->
            <section class="fm-bento-info">

                <article class="app-card dd-card fm-card-session">
                    <header class="dd-card-head">
                        <h3 class="dd-card-title">📅 本次会话</h3>
                    </header>
                    <div class="fm-session-grid">
                        <div class="fm-session-cell">
                            <span class="fm-session-label">开始时间</span>
                            <span class="fm-session-value" id="session-start">--:--:--</span>
                        </div>
                        <div class="fm-session-cell">
                            <span class="fm-session-label">剩余时间</span>
                            <span class="fm-session-value fm-highlight" id="remaining-time">--:--</span>
                        </div>
                    </div>
                    <div class="fm-progress">
                        <div class="fm-progress-track">
                            <div class="fm-progress-fill" id="session-progress" style="width: 75%;"></div>
                        </div>
                        <span class="fm-progress-text" id="progress-label">75% 完成</span>
                    </div>
                </article>

                <article class="app-card dd-card fm-card-tips">
                    <header class="dd-card-head">
                        <h3 class="dd-card-title">💡 专注建议</h3>
                    </header>
                    <div class="tips-list"></div>
                </article>

            </section>

            <!-- ROW D: history -->
            <section class="fm-bento-history">
                <article class="app-chart-card dd-card fm-card-history">
                    <header class="dd-card-head">
                        <div>
                            <h3 class="dd-card-title">📊 历史趋势</h3>
                            <p class="dd-card-desc">心流指数随时间变化</p>
                        </div>
                        <div class="filter-group">
                            <button class="dd-chip filter-btn active" data-range="day" type="button">今日</button>
                            <button class="dd-chip filter-btn" data-range="week" type="button">本周</button>
                            <button class="dd-chip filter-btn" data-range="month" type="button">本月</button>
                        </div>
                    </header>
                    <div class="dd-chart" id="history-chart"></div>
                </article>
            </section>

        </div>
    </div>

    <script src="/js/kanban.js"></script>

    <script src="/js/data-layer.js"></script>

    <!-- Demo data interceptor: mock fetch for /api/focus/analysis/ -->
    <script>
    (function() {
        'use strict';
        if (!window.StarDemoData) return;

        // 心流共振仪定位为演示页：与 data-dashboard.html 一致，
        // 始终展示演示数据（便于演示 / 截图 / 测试，无需登录或 ?demo=1）。
        window.StarDemoData.showBadge();
        console.info('[flow-meter] 当前展示演示数据（始终启用）');

        var _origFetch = window.fetch;
        window.fetch = function(input, init) {
            var url = typeof input === 'string' ? input : (input && input.url) || '';
            if (url.indexOf('/api/focus/analysis/') !== -1) {
                var demoData = window.StarDemoData.getFlowMeterData();
                return Promise.resolve({
                    ok: true,
                    status: 200,
                    json: function() { return Promise.resolve(demoData); }
                });
            }
            return _origFetch.apply(this, arguments);
        };

        // 覆盖 FocusAnalysis.getRealtimeState()，返回演示用实时状态
        function installRealtimeHook() {
            if (!window.FocusAnalysis || !window.FocusAnalysis.getRealtimeState) return false;
            var demo = window.StarDemoData;
            var lastTick = 0;
            var lastState = null;
            window.FocusAnalysis.getRealtimeState = function () {
                var now = Date.now();
                if (!lastState || now - lastTick > 4000) {
                    lastState = demo.getFlowMeterRealtimeState();
                    lastTick = now;
                } else {
                    // 4 秒内小幅抖动置信度，避免指示器僵死
                    lastState.confidence = Math.round(
                        Math.max(0.3, Math.min(0.99, lastState.confidence + (Math.random() - 0.5) * 0.04)) * 100
                    ) / 100;
                    lastState.lastActivitySec = Math.max(0, lastState.lastActivitySec + Math.floor((Math.random() - 0.5) * 6));
                    lastState.timestamp = now;
                }
                return lastState;
            };
            // 同时让原生 _detectRealtimeState 失效：在 demo 模式下让 _realtime 保持演示值
            if (window.FocusAnalysis._emit) {
                var origEmit = window.FocusAnalysis._emit;
                window.FocusAnalysis._emit = function (event, payload) {
                    if (event === 'realtime-changed') {
                        return origEmit.call(this, event, window.FocusAnalysis.getRealtimeState());
                    }
                    return origEmit.apply(this, arguments);
                };
            }
            return true;
        }

        // FocusAnalysis 可能在 demo-data.js 之后才就绪，轮询挂载
        var _hookRetry = 0;
        function tryHook() {
            if (installRealtimeHook()) return;
            if (++_hookRetry > 40) return;
            setTimeout(tryHook, 100);
        }
        tryHook();

        // 立即主动触发一次状态变化事件，让 UI 不用等下一个轮询周期
        setTimeout(function () {
            if (window.FocusAnalysis && window.FocusAnalysis._emit) {
                window.FocusAnalysis._emit('realtime-changed', window.FocusAnalysis.getRealtimeState());
            }
        }, 300);
    })();
    </script>

    <script src="/js/flow-meter.js"></script>

    <script>
    (function() {
        'use strict';

        // ============== Token helpers (复用 data-dashboard 模式) ==============
        function readVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }
        function colorWithAlpha(cssVar, a) {
            var tmp = document.createElement('span');
            tmp.style.color = cssVar;
            tmp.style.position = 'absolute';
            tmp.style.visibility = 'hidden';
            document.body.appendChild(tmp);
            var rgb = getComputedStyle(tmp).color;
            document.body.removeChild(tmp);
            var m = rgb.match(/\d+/g);
            return m ? 'rgba(' + m[0] + ',' + m[1] + ',' + m[2] + ',' + a + ')' : cssVar;
        }
        function chartPalette() {
            return {
                text:    readVar('--text-muted'),
                textHi:  readVar('--text-heading'),
                grid:    readVar('--border-glass'),
                brand:   readVar('--info'),
                brand2:  readVar('--brand-500'),
                success: readVar('--success'),
                warning: readVar('--warning'),
                danger:  readVar('--danger'),
                neutral: readVar('--neutral-400'),
                surface: readVar('--surface-card'),
            };
        }
        function glassTooltipStyle() {
            return 'padding:10px 12px;border-radius:12px;'
                + 'background:var(--surface-glass);backdrop-filter:blur(12px);'
                + '-webkit-backdrop-filter:blur(12px);'
                + 'border:1px solid var(--border-glass);min-width:160px;'
                + 'box-shadow:var(--shadow-md);color:var(--text-heading);';
        }
        function buildGradient(c1, c2) {
            return new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: c1 },
                { offset: 1, color: c2 }
            ]);
        }
        function tooltipFormatter(unit) {
            return function(params) {
                if (!params || !params.length) return '';
                var head = params[0].axisValueLabel || params[0].name || '';
                var rows = params.map(function(p) {
                    var dot = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + p.color + ';margin-right:6px;vertical-align:middle"></span>';
                    return '<div style="display:flex;justify-content:space-between;gap:18px;padding:2px 0">'
                        + '<span style="color:var(--text-body);font-size:11px;">' + dot + (p.seriesName || '') + '</span>'
                        + '<span style="color:var(--text-heading);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums">'
                        + p.value + (unit || '') + '</span>'
                        + '</div>';
                }).join('');
                return '<div style="' + glassTooltipStyle() + '">'
                    + '<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">' + head + '</div>'
                    + rows + '</div>';
            };
        }

        // ============== Clock ==============
        function tickClock() {
            var d = new Date();
            var weekdays = ['日','一','二','三','四','五','六'];
            var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
            var dateStr = d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate())
                + ' · 周' + weekdays[d.getDay()]
                + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
            var el = document.querySelector('#fm-datetime span');
            if (el) el.textContent = dateStr;

            var h = d.getHours();
            var greet = h < 6 ? '夜深了' : h < 11 ? '早上好' : h < 14 ? '中午好'
                      : h < 18 ? '下午好' : h < 22 ? '晚上好' : '夜深了';
            var g = document.getElementById('fm-greeting');
            if (g) g.textContent = greet + '，保持专注 ✨';
        }

        // ============== Number counter animation ==============
        function animateNumber(el, target, duration, suffix) {
            if (!el) return;
            duration = duration || 900;
            suffix = suffix || '';
            var startText = (el.textContent || '').replace(/[^\d.-]/g, '');
            var start = parseFloat(startText) || 0;
            var startTs = performance.now();
            function frame(ts) {
                var t = Math.min(1, (ts - startTs) / duration);
                // easeOutCubic
                var eased = 1 - Math.pow(1 - t, 3);
                var val = Math.round(start + (target - start) * eased);
                el.textContent = val + suffix;
                if (t < 1) requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        // ============== Sparkline drawing (for .dd-spark SVGs) ==============
        function drawSpark(svg) {
            if (!svg) return;
            var key = svg.getAttribute('data-spark') || '';
            // Pseudo-random series based on key for deterministic shape
            var seed = 0;
            for (var i = 0; i < key.length; i++) seed = (seed * 31 + key.charCodeAt(i)) | 0;
            function rand() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }
            var pts = [];
            var N = 14;
            for (var j = 0; j < N; j++) {
                pts.push(0.3 + rand() * 0.7);
            }
            var w = 120, h = 28;
            var step = w / (N - 1);
            var coords = pts.map(function (p, i) {
                return [i * step, h - p * h * 0.85 - 2];
            });
            var dLine = 'M ' + coords.map(function (c) { return c[0].toFixed(1) + ',' + c[1].toFixed(1); }).join(' L ');
            var dArea = dLine + ' L ' + w + ',' + h + ' L 0,' + h + ' Z';
            var ic = (svg.closest('[style*="--ic"]') || {}).style || {};
            var stroke = (ic.getPropertyValue('--ic') || '#6366f1').trim();

            svg.innerHTML =
                '<defs><linearGradient id="spark-fade-' + key + '" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0%" stop-color="' + stroke + '" stop-opacity="0.45"/>' +
                '<stop offset="100%" stop-color="' + stroke + '" stop-opacity="0"/>' +
                '</linearGradient></defs>' +
                '<path d="' + dArea + '" fill="url(#spark-fade-' + key + ')"/>' +
                '<path d="' + dLine + '" fill="none" stroke="' + stroke + '" stroke-width="1.5" ' +
                'stroke-linecap="round" stroke-linejoin="round" pathLength="100" ' +
                'style="stroke-dasharray:100;stroke-dashoffset:100;animation:fm-draw 1.4s cubic-bezier(0.65,0,0.35,1) 0.4s forwards;"/>';
        }

        // ============== Stagger entrance for cards ==============
        function staggerEntrance() {
            var cards = document.querySelectorAll('.fm-bento-stats > *, .fm-bento-charts > *, .fm-bento-info > *, .fm-bento-history > *');
            cards.forEach(function (el, i) {
                el.style.opacity = '0';
                el.style.transform = 'translateY(14px)';
                el.style.transition = 'opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1) ' + (i * 60) + 'ms, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1) ' + (i * 60) + 'ms';
                requestAnimationFrame(function () {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            });
        }

        // ============== Resize ==============
        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                ['waveform-chart','timeofday-chart','history-chart'].forEach(function(id) {
                    var dom = document.getElementById(id);
                    if (dom && dom._echart_) { dom._echart_.resize(); }
                });
            }, 200);
        });

        // ============== Boot ==============
        function boot() {
            if (window.lucide && lucide.createIcons) lucide.createIcons();
            tickClock();
            setInterval(tickClock, 30000);

            // 卡片错落入场
            staggerEntrance();

            // sparkline 折线绘制
            document.querySelectorAll('.dd-spark').forEach(drawSpark);

            // 数字滚动入场（仅首屏可见的值）
            setTimeout(function () {
                var _fs = document.getElementById('kpi-score-value');
                if (_fs) animateNumber(_fs, parseInt((_fs.textContent || '0').replace(/[^\d-]/g, ''), 10) || 0, 1100);
            }, 220);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', boot);
        } else {
            boot();
        }
    })();
    </script>
