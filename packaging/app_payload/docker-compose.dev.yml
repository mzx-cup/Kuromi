version: "3.9"
services:
  qdrant-master:
    image: qdrant/qdrant:v1.9.0
    ports: ["6333:6333"]
    volumes:
      - qdrant_master_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
  qdrant-replica:
    image: qdrant/qdrant:v1.9.0
    ports: ["6334:6333"]
    volumes:
      - qdrant_replica_data:/qdrant/storage
    depends_on:
      qdrant-master:
        condition: service_healthy
  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_master_data:
  qdrant_replica_data:
