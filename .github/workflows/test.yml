name: 星识 Star-Learn 测试流水线

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  # ====== Python 后端测试 ======
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run Python tests with coverage
        run: |
          python -m pytest tests/ \
            --ignore=tests/frontend \
            --ignore=tests/selenium \
            --ignore=tests/robot \
            -v \
            --tb=short \
            -m "not perf" \
            --cov=app \
            --cov=agents \
            --cov=scripts \
            --cov-report=html \
            --cov-report=term \
            --html=reports/pytest-report.html \
            --self-contained-html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: htmlcov/

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: reports/pytest-report.html

  # ====== 前端单元测试 (Vitest) ======
  frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test:unit -- --coverage --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results
          path: reports/

  # ====== E2E 测试 (Playwright) ======
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 5

      - name: Run Playwright E2E tests
        # P0 Task 10: 移除 || echo 假绿灯, 失败必须阻塞合并.
        run: npm run test:e2e

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # ====== 静态审计 (CSS / 前端代码质量) ======
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CSS & frontend audit tools
        run: |
          python scripts/audit_undefined_css_vars.py --report
          python scripts/audit_frontend_smells.py --report
          python scripts/audit_compound_selectors.py --report

      - name: Run audit tool unit tests
        run: |
          python -m pytest tests/scripts/ -v --tb=short

  # ====== agents.py 净增长回归网 (P1 closure follow-up #6) ======
  # Spec invariant: agents.py is a 1600+ line file; P1 added only 32 lines.
  # Future PRs should add behavior via new modules, not by editing agents.py.
  # This job fails the PR if the net change exceeds 50 lines.
  agents-size-net:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check agents.py net growth vs base branch
        run: |
          BASE="${BASE_REF:-origin/main}"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            # Fall back to HEAD~1 if base ref unavailable (e.g., workflow_dispatch on initial main)
            BASE="HEAD~1"
          fi
          BEFORE=$(git show "$BASE":agents.py 2>/dev/null | wc -l)
          AFTER=$(wc -l < agents.py)
          NET=$((AFTER - BEFORE))
          echo "agents.py: $BEFORE -> $AFTER (net $NET lines, base=$BASE)"
          if [ "$NET" -gt 50 ]; then
            echo "::error::agents.py net grew by $NET lines (>50). Refactor instead of patching agents.py."
            exit 1
          fi
