name: 星识 Star-Learn 测试流水线

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  # ====== Python 后端测试 ======
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run Python tests with coverage
        run: |
          python -m pytest tests/ \
            --ignore=tests/frontend \
            --ignore=tests/selenium \
            --ignore=tests/robot \
            -v \
            --tb=short \
            --cov=app \
            --cov=agents \
            --cov=scripts \
            --cov-report=html \
            --cov-report=term \
            --html=reports/pytest-report.html \
            --self-contained-html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: htmlcov/

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: reports/pytest-report.html

  # ====== 前端单元测试 (Vitest) ======
  frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test:unit -- --coverage --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-results
          path: reports/

  # ====== E2E 测试 (Playwright) ======
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
          sleep 5

      - name: Run Playwright E2E tests
        run: npm run test:e2e || echo "E2E tests completed (check report for details)"

      - name: Upload Playwright screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # ====== 静态审计 (CSS / 前端代码质量) ======
  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CSS & frontend audit tools
        run: |
          python scripts/audit_undefined_css_vars.py --report
          python scripts/audit_frontend_smells.py --report
          python scripts/audit_compound_selectors.py --report

      - name: Run audit tool unit tests
        run: |
          python -m pytest tests/scripts/ -v --tb=short
